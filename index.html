<title>Voice Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen stage — settings strip on top, orb centred, captions + speak control below. Deliberately dark, single theme. */
:root{
  --ink:#0d0f17; --ink-2:#161a26; --line:#262b3b;
  --fg:#eceef6; --muted:#9097ad; --accent:#8fd4ff; --warm:#ffb38a; --danger:#ff7a7a;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;max-width:760px;margin:0 auto;box-sizing:border-box}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.2px}
.brand span{color:var(--muted);font-weight:400}
.gear{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 14px;font:500 13px var(--body);cursor:pointer}
.gear:hover{border-color:var(--muted)}
.gear:focus-visible,.speak:focus-visible,select:focus-visible,input:focus-visible,.send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text]{background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:14px var(--body);min-width:0;width:100%;box-sizing:border-box}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);align-self:end;padding-bottom:6px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:10px}
canvas{width:min(62vmin,340px);height:min(62vmin,340px);max-width:100%}
.state{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);height:18px}

.captions{min-height:96px;max-height:22vh;overflow-y:auto;text-align:center;display:flex;flex-direction:column;gap:6px;padding-inline:4px}
.you{color:var(--muted);font-size:14px}
.reply{font-family:var(--display);font-size:clamp(17px,2.6vw,21px);line-height:1.45;text-wrap:balance}
.note{color:var(--warm);font-size:13px}

footer{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px calc(18px + env(safe-area-inset-bottom,0px))}
.speak{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:15px 30px;font:600 16px var(--body);cursor:pointer;background:var(--fg);color:var(--ink);transition:transform .15s ease,background .2s}
.speak:hover{transform:translateY(-1px)}
.speak[data-mode=stop]{background:var(--danger);color:var(--ink)}
.speak svg{width:18px;height:18px}
.typebar{display:flex;gap:8px;width:100%;max-width:520px}
.typebar input{flex:1}
.send{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:0 14px;font:500 14px var(--body);cursor:pointer}
.hint{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.speak{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand">Voice Orb <span>· talk, it talks back</span></div>
    <button class="gear" id="gearBtn" aria-expanded="false" aria-controls="settings">Voice &amp; language</button>
  </header>

  <div>
    <div class="settings" id="settings" hidden>
      <div class="field">
        <label for="lang">Language</label>
        <select id="lang"></select>
      </div>
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div class="field">
        <label for="rate">Speed <output id="rateOut">1.0×</output></label>
        <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1">
      </div>
      <div class="field">
        <label for="pitch">Pitch <output id="pitchOut">1.0</output></label>
        <input type="range" id="pitch" min="0.5" max="1.6" step="0.1" value="1">
      </div>
      <label class="check"><input type="checkbox" id="handsfree"> Keep listening after each reply</label>
      <div class="field" style="align-self:end">
        <button class="gear" id="testVoice" type="button">Test this voice</button>
      </div>
    </div>
  </div>

  <main class="stage">
    <canvas id="orb" width="680" height="680" aria-hidden="true"></canvas>
    <div class="state" id="state">Ready</div>
    <div class="captions" aria-live="polite">
      <div class="you" id="you"></div>
      <div class="reply" id="reply">Press Speak and say anything. Pick a voice and language up top.</div>
      <div class="note" id="note"></div>
    </div>
  </main>

  <footer>
    <button class="speak" id="speakBtn" type="button" data-mode="speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="speakLabel">Speak</span>
    </button>
    <form class="typebar" id="typeForm">
      <input type="text" id="typeInput" placeholder="…or type a message" autocomplete="off">
      <button class="send" type="submit">Send</button>
    </form>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<script>
const LANGS=[
 ["en-US","English (US)"],["en-GB","English (UK)"],["en-IN","English (India)"],["hi-IN","Hindi"],["gu-IN","Gujarati"],
 ["mr-IN","Marathi"],["bn-IN","Bengali"],["ta-IN","Tamil"],["te-IN","Telugu"],["kn-IN","Kannada"],["ml-IN","Malayalam"],
 ["pa-IN","Punjabi"],["ur-PK","Urdu"],["es-ES","Spanish"],["fr-FR","French"],["de-DE","German"],["it-IT","Italian"],
 ["pt-BR","Portuguese (Brazil)"],["ru-RU","Russian"],["ar-SA","Arabic"],["tr-TR","Turkish"],["ja-JP","Japanese"],
 ["ko-KR","Korean"],["zh-CN","Chinese (Mandarin)"],["id-ID","Indonesian"],["nl-NL","Dutch"],["pl-PL","Polish"],["sv-SE","Swedish"]
];
const $=id=>document.getElementById(id);
const langSel=$("lang"),voiceSel=$("voice"),rate=$("rate"),pitch=$("pitch");
const speakBtn=$("speakBtn"),speakLabel=$("speakLabel"),stateEl=$("state");
const youEl=$("you"),replyEl=$("reply"),noteEl=$("note"),hint=$("hint");
const synth=window.speechSynthesis;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

let mode="idle";           // idle | listening | thinking | speaking
let sample=null, ctl=null, rec=null;
let turns=[];
let queue=[], spokenUpTo=0, streamDone=false, speakingNow=false;
let energy=0;              // drives orb wobble

/* ---------- settings ---------- */
function load(k,d){try{return localStorage.getItem(k)??d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch{}}
LANGS.forEach(([c,n])=>langSel.add(new Option(n,c)));
langSel.value=load("vo.lang","en-IN");
rate.value=load("vo.rate","1"); pitch.value=load("vo.pitch","1");
$("handsfree").checked=load("vo.hf","0")==="1";
const showVals=()=>{$("rateOut").textContent=(+rate.value).toFixed(1)+"×";$("pitchOut").textContent=(+pitch.value).toFixed(1)};
showVals();

function fillVoices(){
  if(!synth) return;
  const all=synth.getVoices(); const lang=langSel.value, base=lang.split("-")[0];
  let list=all.filter(v=>v.lang.replace("_","-")===lang);
  if(!list.length) list=all.filter(v=>v.lang.toLowerCase().startsWith(base));
  const others=all.filter(v=>!list.includes(v));
  voiceSel.innerHTML="";
  if(!list.length){ const o=new Option("No "+langSel.selectedOptions[0].text+" voice on this device — using default",""); voiceSel.add(o); }
  list.forEach(v=>voiceSel.add(new Option(v.name+(v.localService?"":" · online"),v.name)));
  if(others.length){const g=document.createElement("optgroup");g.label="Other voices";others.forEach(v=>g.appendChild(new Option(v.name+" ("+v.lang+")",v.name)));voiceSel.add(g)}
  const saved=load("vo.voice."+lang,"");
  if(saved && [...voiceSel.options].some(o=>o.value===saved)) voiceSel.value=saved;
}
if(synth){fillVoices(); synth.onvoiceschanged=fillVoices;}
langSel.onchange=()=>{save("vo.lang",langSel.value);fillVoices()};
voiceSel.onchange=()=>save("vo.voice."+langSel.value,voiceSel.value);
rate.oninput=()=>{save("vo.rate",rate.value);showVals()};
pitch.oninput=()=>{save("vo.pitch",pitch.value);showVals()};
$("handsfree").onchange=e=>save("vo.hf",e.target.checked?"1":"0");
$("gearBtn").onclick=()=>{const s=$("settings");s.hidden=!s.hidden;$("gearBtn").setAttribute("aria-expanded",String(!s.hidden))};
$("testVoice").onclick=()=>{stopAll();setMode("speaking");queue=[sampleLine()];streamDone=true;spokenUpTo=0;pump()};
function sampleLine(){
  const m={hi:"नमस्ते! मैं ऐसे बोलती हूँ।",gu:"નમસ્તે! હું આ રીતે બોલું છું.",mr:"नमस्कार! मी असं बोलते.",bn:"নমস্কার! আমি এভাবে কথা বলি।",ta:"வணக்கம்! நான் இப்படித்தான் பேசுவேன்.",te:"నమస్కారం! నేను ఇలా మాట్లాడతాను.",es:"¡Hola! Así es como sueno.",fr:"Bonjour ! Voici ma voix.",de:"Hallo! So klinge ich.",ja:"こんにちは。私はこんな声です。",zh:"你好！这是我的声音。",ko:"안녕하세요! 제 목소리예요.",ar:"مرحبا! هذا هو صوتي.",ru:"Привет! Вот так звучит мой голос."};
  return m[langSel.value.split("-")[0]]||"Hi! This is how I sound.";
}
function pickVoice(){if(!synth)return null;return synth.getVoices().find(v=>v.name===voiceSel.value)||null}

/* ---------- modes ---------- */
function setMode(m){
  mode=m;
  stateEl.textContent={idle:"Ready",listening:"Listening…",thinking:"Thinking…",speaking:"Speaking"}[m];
  const busy=m!=="idle";
  speakBtn.dataset.mode=busy?"stop":"speak";
  speakLabel.textContent=m==="listening"?"Done":busy?"Stop":"Speak";
}

/* ---------- listening ---------- */
let micBroken=!SR;
if(micBroken) hint.textContent="Voice input isn't supported in this browser — type below instead. Replies are still spoken.";

speakBtn.onclick=()=>{
  if(mode==="listening"){ rec&&rec.stop(); return; }
  if(mode!=="idle"){ stopAll(); setMode("idle"); return; }
  primeAudio();
  if(micBroken){ $("typeInput").focus(); noteEl.textContent="Microphone isn't available here — type your message and press Send."; return; }
  listen();
};

function listen(){
  noteEl.textContent=""; youEl.textContent="";
  rec=new SR(); rec.lang=langSel.value; rec.interimResults=true; rec.continuous=false;
  let finalText="";
  rec.onresult=e=>{
    let interim="";
    for(const r of e.results){ if(r.isFinal) finalText=r[0].transcript; else interim+=r[0].transcript; }
    youEl.textContent=(finalText||interim);
    energy=Math.min(1,energy+.25);
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){
      micBroken=true;
      noteEl.textContent="The microphone is blocked in this view. Type your message below — I'll still answer out loud.";
      $("typeInput").focus();
    } else if(e.error==="no-speech"){ noteEl.textContent="I didn't hear anything. Press Speak and try again."; }
    else if(e.error==="language-not-supported"){ noteEl.textContent="Speech recognition doesn't support "+langSel.selectedOptions[0].text+" here. Type instead."; }
  };
  rec.onend=()=>{ rec=null; const t=(finalText||youEl.textContent).trim(); if(t && mode==="listening") ask(t); else if(mode==="listening") setMode("idle"); };
  try{ rec.start(); setMode("listening"); }catch{ micBroken=true; noteEl.textContent="Couldn't start the microphone. Type instead."; }
}

$("typeForm").addEventListener("submit",e=>{
  e.preventDefault(); const t=$("typeInput").value.trim(); if(!t) return;
  $("typeInput").value=""; primeAudio(); stopAll(); noteEl.textContent=""; youEl.textContent=t; ask(t);
});

/* ---------- thinking ---------- */
function rules(){
  const lang=langSel.selectedOptions[0].text;
  return `You are a warm, friendly voice companion having a spoken conversation, like a phone call. Always reply in ${lang}, written in that language's native script, even if the person mixes languages. Your reply will be read aloud by a text-to-speech voice, so: no markdown, no bullet points, no emoji, no URLs, no code. Keep replies short and natural — usually one to three sentences — unless the person asks for detail. Spell out numbers and symbols the way they would be spoken.`;
}
async function ask(text){
  if(!sample && window.claude){ sample=await window.claude.use("sample"); }
  if(!sample){ noteEl.textContent="The AI isn't available in this view. Open this page in Claude to chat."; setMode("idle"); return; }
  turns.push({role:"user",content:text});
  if(turns.length>20) turns=turns.slice(-20);
  if(turns[0].role!=="user") turns.shift();
  setMode("thinking"); replyEl.textContent="";
  queue=[]; spokenUpTo=0; streamDone=false;
  ctl=new AbortController();
  try{
    const {text:full}=await sample([{role:"user",content:rules()},...turns],{
      cache:false, modelTier:"quick", signal:ctl.signal,
      onText:({text})=>{ replyEl.textContent=text; chunk(text,false); }
    });
    turns.push({role:"assistant",content:full});
    streamDone=true; chunk(full,true);
  }catch(e){
    streamDone=true;
    if(e.code==="cancelled") return;
    turns.pop();
    replyEl.textContent=e.text||"";
    noteEl.textContent={not_granted:"You declined AI access for this page. Reload to allow it.",rate_limited:"Too many requests right now. Wait a moment, then try again.",session_expired:"Please sign in to Claude again.",refused:"I can't help with that one. Try asking something else."}[e.code]||"Something went wrong reaching the AI. Try again.";
    if(!speakingNow && !queue.length) setMode("idle");
  }
}

/* split streamed text into sentences and speak them as they arrive */
function chunk(text,final){
  const rest=text.slice(spokenUpTo);
  const re=/[^.!?।॥。！？\n]+[.!?।॥。！？\n]+["'”’)]*\s*/g;
  let m,last=0;
  while((m=re.exec(rest))){ const s=m[0].trim(); if(s) queue.push(s); last=re.lastIndex; }
  spokenUpTo+=last;
  if(final){ const tail=text.slice(spokenUpTo).trim(); if(tail) queue.push(tail); spokenUpTo=text.length; }
  pump();
}

/* ---------- speaking ---------- */
let keepAlive=null;
function pump(){
  if(!synth){ noteEl.textContent="This browser can't speak aloud."; if(streamDone) setMode("idle"); return; }
  if(speakingNow) return;
  if(!queue.length){ if(streamDone && mode!=="idle" && mode!=="listening") finishTurn(); return; }
  const u=new SpeechSynthesisUtterance(queue.shift());
  const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang}else{u.lang=langSel.value}
  u.rate=+rate.value; u.pitch=+pitch.value;
  u.onstart=()=>{ speakingNow=true; setMode("speaking"); energy=.8; };
  u.onboundary=()=>{ energy=Math.min(1,energy+.45); };
  u.onend=u.onerror=()=>{ speakingNow=false; pump(); };
  speakingNow=true; synth.speak(u);
  clearInterval(keepAlive); keepAlive=setInterval(()=>{ if(synth.speaking){synth.pause();synth.resume()} },10000); // Chrome long-speech bug
}
function finishTurn(){
  clearInterval(keepAlive); setMode("idle");
  if($("handsfree").checked && !micBroken) setTimeout(()=>{ if(mode==="idle") listen(); },350);
}
function stopAll(){
  ctl&&ctl.abort(); ctl=null;
  rec&&rec.abort(); rec=null;
  queue=[]; streamDone=true; speakingNow=false;
  synth&&synth.cancel(); clearInterval(keepAlive);
}
function primeAudio(){ if(synth){ const u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u);} }

/* ---------- the orb ---------- */
const cv=$("orb"), cx=cv.getContext("2d"), W=cv.width, H=cv.height;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const PAL={ // hue anchors per mode
  idle:[210,250,190], listening:[185,160,215], thinking:[265,290,235], speaking:null
};
let hueShift=0, cur=[210,250,190], amp=0, t0=performance.now();
function lerp(a,b,k){return a+(b-a)*k}
function lerpHue(a,b,k){let d=((b-a+540)%360)-180;return (a+d*k+360)%360}
function frame(now){
  const t=(now-t0)/1000;
  // speaking: keep flutter alive even if the voice sends no boundary events
  if(mode==="speaking" && Math.random()<.12) energy=Math.min(1,energy+.25);
  energy*=0.94;
  const targetAmp = mode==="speaking"?.05+energy*.16 : mode==="listening"?.04+energy*.08 : mode==="thinking"?.05 : .022;
  amp=lerp(amp,targetAmp,.12);
  hueShift=(hueShift+(mode==="speaking"?0.9+energy*2.5:mode==="thinking"?0.6:0.08))%360;
  const target = mode==="speaking" ? [ (20+hueShift)%360, (140+hueShift)%360, (260+hueShift)%360 ] : PAL[mode].map(h=>(h+hueShift*.15)%360);
  cur=cur.map((h,i)=>lerpHue(h,target[i],.06));

  cx.clearRect(0,0,W,H);
  const R=W*0.30, c=W/2;
  // glow
  const g=cx.createRadialGradient(c,c,R*.6,c,c,R*1.65);
  g.addColorStop(0,`hsla(${cur[0]},90%,60%,${.28+amp})`); g.addColorStop(1,"hsla(0,0%,0%,0)");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);

  // three blended lobes, each a wobbly circle
  cx.globalCompositeOperation="lighter";
  for(let k=0;k<3;k++){
    const ph=k*2.1, sp=reduce?0:1;
    const ox=Math.cos(t*.7*sp+ph)*R*amp*1.4, oy=Math.sin(t*.9*sp+ph)*R*amp*1.4;
    cx.beginPath();
    for(let i=0;i<=96;i++){
      const a=i/96*Math.PI*2;
      const w=1+amp*(Math.sin(a*3+t*2.2*sp+ph)+.6*Math.sin(a*5-t*3.1*sp+ph*1.7)+.35*Math.sin(a*2+t*1.3*sp));
      const r=R*.92*w;
      const x=c+ox+Math.cos(a)*r, y=c+oy+Math.sin(a)*r;
      i?cx.lineTo(x,y):cx.moveTo(x,y);
    }
    const lg=cx.createRadialGradient(c+ox-R*.3,c+oy-R*.35,R*.1,c+ox,c+oy,R*1.1);
    lg.addColorStop(0,`hsla(${cur[k]},95%,72%,.85)`);
    lg.addColorStop(.6,`hsla(${cur[k]},85%,52%,.55)`);
    lg.addColorStop(1,`hsla(${cur[(k+1)%3]},80%,40%,.15)`);
    cx.fillStyle=lg; cx.fill();
  }
  cx.globalCompositeOperation="source-over";
  // glossy highlight
  const hl=cx.createRadialGradient(c-R*.35,c-R*.45,0,c-R*.35,c-R*.45,R*.7);
  hl.addColorStop(0,"rgba(255,255,255,.35)"); hl.addColorStop(1,"rgba(255,255,255,0)");
  cx.fillStyle=hl; cx.beginPath(); cx.arc(c,c,R*.95,0,Math.PI*2); cx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setMode("idle");
(window.claude?window.claude.use("sample"):Promise.resolve(null)).then(s=>{sample=s; if(!s) hint.textContent="Open this page inside Claude to chat with the AI.";});
</script>
